name: Game Status Override
description: Mark a game or doubleheader as postponed or cancelled
title: "[Game Status] "
labels: ["game-status"]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      options:
        - "MDB Knights 9U Sweeney (2027)"
        - "MDB Knights 10U Gold (2027)"
        - "MDB Knights 11U Wagner (2027)"
        - "MDB Knights 11U Golbranson (2027)"
        - "MDB Knights 11U Blue (2027)"
        - "MDB Knights 12U Gold (2027)"
        - "MDB Knights 12U Blue (2027)"
        - "MDB Knights 13U Schnabel (2027)"
        - "MDB Knights 13U Fitzgibbons (2027)"
        - "MDB Knights 14U Earle (2027)"
        - "MDB Knights 14U Butts (2027)"
        - "MDB Knights 14U Duffy/Fitzgerald (2027)"
        - "MDB Knights 15U Duffy/Morrissey (2027)"
        - "MDB Knights 15U Golbranson (2027)"
        - "MDB Knights 16/17U (2027)"
        - "MDB Knights 11U Gold (2026)"
        - "MDB Knights 14U Blue (2026)"
        - "MDB Knights 11U Blue (2026)"
        - "MDB Knights 13U Gold (2026)"
        - "MDB Knights 13U Blue (2026)"
        - "MDB Knights 10U Gold (2026)"
        - "Braintree Bandits 11U Mercado (2026)"
        - "MDB Knights 12U Gold (2026)"
        - "MDB Knights 12U Blue (2026)"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date of game
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-04-15"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - postponed
        - cancelled
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason (optional)
      placeholder: "Weather forecast / Opponent withdrew / etc."
    validations:
      required: false
