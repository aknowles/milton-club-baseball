name: Snack Signup
description: Sign up to bring snacks for a game day
title: "[Snacks] Signup: "
labels: ["snack-signup"]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      options:
        - MDB Knights 11U Gold
        - MDB Knights 14U Blue
        - MDB Knights 11U Blue
        - MDB Knights 13U Gold
        - MDB Knights 13U Blue
        - MDB Knights 10U Gold
        - Braintree Bandits 11U Mercado
        - MDB Knights 9U Sweeney 2027
        - MDB Knights 10U Gold 2027
        - MDB Knights 11U Wagner 2027
        - MDB Knights 11U Golbranson 2027
        - MDB Knights 11U Blue 2027
        - MDB Knights 12U Maguire 2027
        - MDB Knights 12U Blue 2027
        - MDB Knights 13U Schnabel 2027
        - MDB Knights 13U Fitzgibbons 2027
        - MDB Knights 14U Earle 2027
        - MDB Knights 14U Butts 2027
        - MDB Knights 14U Duffy/Fitzgerald 2027
        - MDB Knights 15U Duffy/Morrissey 2027
        - MDB Knights 15U Golbranson 2027
        - MDB Knights 16/17U 2027
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Game Date
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-04-12"
    validations:
      required: true
  - type: input
    id: families
    attributes:
      label: Family Name(s)
      description: "Comma-separated if multiple families are signing up"
      placeholder: "Smith, Johnson"
    validations:
      required: true
