name: Snack Signup
description: Sign up to bring snacks for a game day
title: "[Snacks] Signup: "
labels: ["snack-signup"]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      options:
        - "MDB Knights 9U – Coach Sweeney (2027)"
        - "MDB Knights 10U Gold (2027)"
        - "MDB Knights 11U – Coach Wagner (2027)"
        - "MDB Knights 11U – Coach Golbranson (2027)"
        - "MDB Knights 11U Blue (2027)"
        - "MDB Knights 12U Gold – Coach Maguire (2027)"
        - "MDB Knights 12U Blue (2027)"
        - "MDB Knights 13U – Coach Schnabel (2027)"
        - "MDB Knights 13U – Coach Fitzgibbons (2027)"
        - "MDB Knights 14U – Coach Earle (2027)"
        - "MDB Knights 14U – Coach Butts (2027)"
        - "MDB Knights 14U – Coach Duffy/Fitzgerald (2027)"
        - "MDB Knights 15U – Coach Duffy/Morrissey (2027)"
        - "MDB Knights 15U – Coach Golbranson (2027)"
        - "MDB Knights 16/17U (2027)"
        - "MDB Knights 11U Gold (2026)"
        - "MDB Knights 14U Blue (2026)"
        - "MDB Knights 11U Blue (2026)"
        - "MDB Knights 13U Gold (2026)"
        - "MDB Knights 13U Blue (2026)"
        - "MDB Knights 10U Gold (2026)"
        - "Braintree Bandits 11U Mercado (2026)"
        - "MDB Knights 12U Gold (2026)"
        - "MDB Knights 12U Blue (2026)"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Game Date
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-04-12"
    validations:
      required: true
  - type: input
    id: families
    attributes:
      label: Family Name(s)
      description: "Comma-separated if multiple families are signing up"
      placeholder: "Smith, Johnson"
    validations:
      required: true
