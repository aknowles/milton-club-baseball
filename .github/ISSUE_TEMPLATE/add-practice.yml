name: Add Practice
description: Add a new practice, bullpen session, or hitting session
title: "[Practice] Add: "
labels: ["practice-change"]
body:
  - type: dropdown
    id: team
    attributes:
      label: Team
      options:
        - "MDB Knights 9U Sweeney (2027)"
        - "MDB Knights 10U Gold (2027)"
        - "MDB Knights 11U Wagner (2027)"
        - "MDB Knights 11U Golbranson (2027)"
        - "MDB Knights 11U Blue (2027)"
        - "MDB Knights 12U Gold (2027)"
        - "MDB Knights 12U Blue (2027)"
        - "MDB Knights 13U Schnabel (2027)"
        - "MDB Knights 13U Fitzgibbons (2027)"
        - "MDB Knights 14U Earle (2027)"
        - "MDB Knights 14U Butts (2027)"
        - "MDB Knights 14U Duffy/Fitzgerald (2027)"
        - "MDB Knights 15U Duffy/Morrissey (2027)"
        - "MDB Knights 15U Golbranson (2027)"
        - "MDB Knights 16/17U (2027)"
        - "MDB Knights 11U Gold (2026)"
        - "MDB Knights 14U Blue (2026)"
        - "MDB Knights 11U Blue (2026)"
        - "MDB Knights 13U Gold (2026)"
        - "MDB Knights 13U Blue (2026)"
        - "MDB Knights 10U Gold (2026)"
        - "Braintree Bandits 11U Mercado (2026)"
        - "MDB Knights 12U Gold (2026)"
        - "MDB Knights 12U Blue (2026)"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-04-15"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time
      description: "Format: H:MM AM/PM"
      placeholder: "5:30 PM"
    validations:
      required: true
  - type: input
    id: duration
    attributes:
      label: Duration (minutes)
      value: "90"
      placeholder: "90"
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: "Cunningham Park Field 2"
    validations:
      required: false
  - type: input
    id: title
    attributes:
      label: Event Title
      description: "Leave blank for default (Team Name Practice)"
      placeholder: "Bullpen Session"
    validations:
      required: false
