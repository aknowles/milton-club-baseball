name: Process Game Status Override

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  process:
    # Only a repo owner, org member or collaborator can approve. Without the
    # author_association check anyone with a GitHub account could approve
    # their own issue and have it written to config.json on main.
    if: >-
      github.event.comment.body == '/approve' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, '[Game Status]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # commit config.json
      issues: write    # comment on and close the issue
      actions: write   # dispatch the calendar rebuild
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # Issue text is untrusted: it reaches the script through environment
      # variables only, never by interpolation into a shell command.
      - name: Process game status override
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python process_game_status_issue.py

      - name: Commit and push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Game status override from issue #${ISSUE_NUMBER}"
          # Retry with a rebase in case another approval landed first
          for i in 1 2 3; do
            git push && exit 0
            echo "Push failed, rebasing and retrying ($i/3)..."
            sleep 2
            git pull --rebase origin main
          done
          echo "ERROR: Push failed after 3 retries"
          exit 1

      - name: Trigger calendar rebuild
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update-calendar.yml',
              ref: 'main'
            });

      - name: Close issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const msg = 'Game status override applied and committed. The calendar is rebuilding now.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Report failure on the issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `This request could not be fully applied. The [workflow log](${run}) says why. Edit the issue to fix it, then comment \`/approve\` again.`
            });
