name: Update Baseball Calendar

on:
  schedule:
    # Active season (March–June): four times daily at 6 AM, 11 AM, 4 PM,
    # and 10 PM ET (UTC-4).
    - cron: '0 10 * 3-6 *'
    - cron: '0 15 * 3-6 *'
    - cron: '0 20 * 3-6 *'
    - cron: '0 2 * 3-6 *'
    # Late summer (July–August): once daily at 8 AM ET.
    - cron: '0 12 * 7-8 *'
    # Off-season (September–February): three times weekly,
    # Mon/Wed/Fri at 8 AM ET.
    - cron: '0 12 * 9-12 1,3,5'
    - cron: '0 12 * 1-2 1,3,5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper.py'
      - 'teams.py'
      - 'ntfy.py'
      - 'requirements.txt'
      - 'config.json'
      - '.github/workflows/update-calendar.yml'

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # keepalive step re-enables this workflow
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch previous snapshot from Pages
        run: |
          mkdir -p calendars
          HTTP_CODE=$(curl -s -o calendars/snapshot.json -w "%{http_code}" \
            "https://aknowles.github.io/milton-club-baseball/calendars/snapshot.json") || true
          echo "Snapshot fetch HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: Snapshot fetch failed (HTTP $HTTP_CODE) — using empty snapshot"
            echo '{}' > calendars/snapshot.json
          fi
          SNAP_SIZE=$(wc -c < calendars/snapshot.json)
          echo "Snapshot file size: ${SNAP_SIZE} bytes"
          if [ "$SNAP_SIZE" -lt 10 ]; then
            echo "WARNING: Snapshot is suspiciously small (${SNAP_SIZE} bytes)"
          fi
          # Reuse earlier address lookups so each run only geocodes new venues
          curl -sf -o calendars/geocode_cache.json \
            "https://aknowles.github.io/milton-club-baseball/calendars/geocode_cache.json" \
            || rm -f calendars/geocode_cache.json

      - name: Run scraper
        run: python scraper.py

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which happens every off-season. Re-enabling the workflow
      # through the API resets that clock.
      - name: Keep scheduled runs alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/${REPO}/actions/workflows/update-calendar.yml/enable"

      # Publish only the generated site, not the repository's source files
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r calendars _site/calendars

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify-failure:
    needs: [scrape, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'workflow-failure',
              state: 'open'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Calendar update workflow failed',
                body: `Workflow run failed at ${new Date().toISOString()}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['workflow-failure']
              });
            }
