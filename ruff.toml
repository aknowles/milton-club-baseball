target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = [
    "E501",  # the HTML template in scraper.py has long lines
    "S608",  # false positive: the HTML page template is not SQL
    "S310",  # urlopen is only ever called with the fixed https://ntfy.sh base
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
